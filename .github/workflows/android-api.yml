name: Android API security
on:
  pull_request:
  push:
    branches: [feature/android-account-api]
permissions:
  contents: read
jobs:
  api-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:android
      - run: npm run test:android:emulator
      - run: npx tsc --noEmit
